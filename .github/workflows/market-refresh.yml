name: Refresh company market data

# Backup schedule: 00:47 UTC Tue–Sat, after the US close and after DTCC publishes the previous day's
# credit file (~00:15 UTC). The primary trigger is a launchd job on the owner's Mac (GitHub cron runs late).
on:
  schedule:
    - cron: "47 0 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch SEC filings, daily closes and DTCC CDS trades
        env:
          # SEC asks for a descriptive User-Agent with a contact address. Set it as a repository secret.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node scripts/fetch-market.mjs
      - name: Validate before publishing
        run: npx vitest run && npx tsc -b
      - name: Commit snapshot if it changed
        run: |
          if git diff --quiet -- public/data/market data/derived && [ -z "$(git ls-files --others --exclude-standard data/derived)" ]; then
            echo "No change in market data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/market data/derived
          git commit -m "Refresh company market data ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
